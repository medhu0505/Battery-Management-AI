name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-unit-tests:
    name: Lint + unit tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check bms_copilot tests
          ruff format --check bms_copilot tests
      - name: Unit tests
        run: python -m pytest -m "not slow" -q

  end-to-end:
    name: End-to-end (trains a small model set, drives every API route)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: End-to-end tests
        run: python -m pytest -m slow -q
