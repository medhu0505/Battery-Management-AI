[project]
name = "bms-copilot"
version = "1.0.0"
description = "AI battery management for laptops: electrochemical health estimation, adaptive charging, early fault warning and an agentic service workforce."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Medhansh Sharma" }]
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "cryptography>=42",
  "anthropic>=1.0",
  "onnx>=1.16",
  "onnxruntime>=1.18",
  "qrcode>=7.4",
]
keywords = ["battery", "bms", "machine-learning", "gaussian-process", "reinforcement-learning", "digital-twin"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.urls]
Repository = "https://github.com/medhu0505/Battery-Management-AI"

[project.scripts]
bms-copilot-train = "bms_copilot.train:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bms_copilot*"]

[tool.setuptools.package-data]
bms_copilot = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: builds a small artifact set end to end (about 2 minutes)"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
# B905: zip() over numpy arrays of equal length by construction; strict= adds noise.
ignore = ["B905"]
